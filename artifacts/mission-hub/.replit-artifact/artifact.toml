kind = "web"
previewPath = "/"
title = "Mission Hub Digital Solution"
version = "1.0.0"
id = "artifacts/mission-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24165

[services.development]
run = "pnpm --filter @workspace/mission-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mission-hub", "run", "build" ]
publicDir = "artifacts/mission-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24165"
BASE_PATH = "/"
